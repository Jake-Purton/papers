[package]
name = "papers"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15.7"
notify = "8.2.1"
rusqlite = { version = "0.38", features = ["bundled"] }
zip = "9.2.0"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
quick-xml = "0.37"
percent-encoding = "2"
